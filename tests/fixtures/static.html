<!doctype html>
<html><head><meta charset="utf-8"><title>static</title>
<style>.bars{display:flex;align-items:flex-end;gap:8px;height:200px;padding:16px}.bars div{flex:1;background:#89b4fa}</style>
</head><body><div class="bars"><div style="height:40%"></div><div style="height:70%"></div><div style="height:55%"></div><div style="height:90%"></div></div>
<input id="field" autocomplete="off"><div id="typed"></div>
<script>
const field = document.getElementById("field");
window.__keys = [];
field.addEventListener("keydown", (e) => window.__keys.push(e.key));
field.addEventListener("input", () => { document.getElementById("typed").textContent = field.value; });
</script></body></html>
