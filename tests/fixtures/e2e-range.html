<!doctype html>
<html><head><meta charset="utf-8"><title>e2e range</title>
<style>input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0}</style>
</head><body>
<input id="r" type="range" min="0" max="100" value="0">
<script>
// E2E (RQ02): every input event during a drag reports the slider value through pi.send.
const r = document.getElementById("r");
r.addEventListener("input", () => pi.send({ value: Number(r.value) }));
</script></body></html>
