<!doctype html>
<html><head><meta charset="utf-8"><title>check overflow</title>
<style>
#tall { height: 500px; background: #45475a; }
.box { width: 200px; height: 50px; overflow: hidden; background: #313244; }
#wide { display: block; width: 400px; height: 20px; background: #f38ba8; }
.log { height: 60px; overflow: auto; }
.log div { height: 20px; }
</style>
</head><body>
<div class="box"><span id="wide"></span></div>
<div class="log"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>
<div id="tall"><p>child of tall</p></div>
</body></html>
